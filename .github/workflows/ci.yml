name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: support_agent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests (incl. real Postgres + pgvector)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/support_agent_test
        run: uv run pytest

  image:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: support-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container boots
        run: |
          docker run -d --name app -p 8000:8000 \
            -e CHECKPOINTER_BACKEND=memory -e RETRIEVER_BACKEND=memory \
            -e AZURE_OPENAI_ENDPOINT=https://example.openai.azure.com/ \
            -e AZURE_OPENAI_API_KEY=unused support-agent:ci
          for i in $(seq 1 20); do curl -fsS localhost:8000/health/live && exit 0; sleep 1; done
          docker logs app; exit 1
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: support-agent:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
