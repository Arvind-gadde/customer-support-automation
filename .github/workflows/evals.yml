# Model-behaviour evals against the real OpenAI API. Manual + nightly, NOT per-PR:
# they cost tokens and are non-deterministic.
name: evals

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"   # 02:00 IST

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    environment: evals
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          enable-cache: true
      - run: uv sync --frozen
      - name: Run evals
        env:
          # Use a SEPARATE project key for evals, with its own budget cap.
          OPENAI_API_KEY: ${{ secrets.OPENAI_EVALS_API_KEY }}
          OPENAI_CHAT_MODEL: ${{ vars.OPENAI_CHAT_MODEL || 'gpt-4.1-mini' }}
          CHECKPOINTER_BACKEND: memory
          RETRIEVER_BACKEND: memory
          SEMANTIC_CACHE_ENABLED: "false"
        run: uv run python -m evals.run_evals --min-pass-rate 0.9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
