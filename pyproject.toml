[project]
name = "support-agent"
version = "0.1.0"
description = "Production-grade customer support agent (LangGraph + FastAPI) deployed on Azure Container Apps."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "langgraph>=1.2",
    "langchain-core>=1.6",
    "langchain-openai>=1.6",
    "langgraph-checkpoint-postgres>=3.1",
    "psycopg[binary,pool]>=3.3",
    "azure-identity>=1.26",
    "azure-monitor-opentelemetry>=1.8",
    "structlog>=26.1",
    "httpx>=0.28",
    "tenacity>=9.1",
]

[project.scripts]
support-agent-ingest = "support_agent.rag.ingest:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "mypy>=2.4",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "RET"]
ignore = [
    "S101",   # asserts are fine in tests
    "RUF012", # mutable class attrs flagged on pydantic/TypedDict
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"evals/**" = ["S"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.12"
packages = ["support_agent"]
mypy_path = "src"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["azure.monitor.*", "langgraph.*", "langchain_openai.*"]
ignore_missing_imports = true
