# Local stack: API + Postgres (pgvector). LLM calls go to the OpenAI API.
#   make up      -> start everything
#   make ingest  -> load data/knowledge_base into pgvector
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: support_agent
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d support_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/support_agent
      LOG_JSON: "false"
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    # OPENAI_API_KEY and the rest come from .env (see .env.example).

volumes:
  pgdata:
