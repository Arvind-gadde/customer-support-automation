# Local stack: API + Postgres (pgvector). Azure OpenAI stays in the cloud.
#   make up      -> start everything
#   make ingest  -> load data/knowledge_base into pgvector
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: support_agent
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d support_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/support_agent
      LOG_JSON: "false"
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    # The slim image has no Azure CLI, so `az login` creds can't be used in here.
    # For compose, set AZURE_OPENAI_API_KEY in .env - or use `make run` on the host,
    # where DefaultAzureCredential picks up your `az login` session.

volumes:
  pgdata:
